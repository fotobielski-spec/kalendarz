<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="language" content="pl" />
    <title>Kalendarz</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body spellcheck="false">
    <div class="app">
      <header class="header">
        <h1 class="logo" translate="no">Kalendarz</h1>
        <nav class="menu" aria-label="Główne menu" spellcheck="false">
          <button type="button" class="menu__item menu__item--active" data-view="month">
            Miesiąc
          </button>
          <button type="button" class="menu__item" data-view="week">Tydzień</button>
          <button type="button" class="menu__item" data-view="day">Dzień</button>
          <button type="button" class="menu__item" id="btn-today">Dziś</button>
          <button type="button" class="menu__item" id="btn-settings">Ustawienia</button>
        </nav>
      </header>

      <main class="main">
        <div class="toolbar">
          <button type="button" class="toolbar__btn" id="btn-prev" aria-label="Poprzedni miesiąc">
            ‹
          </button>
          <h2 class="toolbar__title" id="month-title" spellcheck="false"></h2>
          <button type="button" class="toolbar__btn" id="btn-next" aria-label="Następny miesiąc">
            ›
          </button>
        </div>

        <div class="calendar" id="calendar" role="grid" aria-labelledby="month-title"></div>
      </main>

      <aside class="sidebar" id="sidebar" hidden>
        <h3 class="sidebar__title">Ustawienia</h3>
        <p class="sidebar__text">Kalendarz w języku polskim.</p>
        <button type="button" class="sidebar__close" id="btn-close-settings">Zamknij</button>
      </aside>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
